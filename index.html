<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex Explorer</title>
    <link rel="stylesheet" href="matrixPokedex/static/main.css">
</head>
<body>
    <div class="pokedex-app">
        <header class="pokedex-header">
            <h1>Pokedex Explorer</h1>
            <p>Search pokemon by name or id and inspect details using the PokéAPI.</p>
        </header>

        <section class="pokedex-controls">
            <input id="searchInput" type="text" placeholder="Search by name or ID (e.g., pikachu or 25)" aria-label="Pokemon search" />
            <button id="searchButton">Search</button>
            <button id="loadRandom">Random</button>
            <button id="loadBatch">Load 20</button>
        </section>

        <section id="loading" class="invisible">Loading...</section>

        <section id="pokedexGrid" class="pokedex-grid"></section>

        <section id="pokemonDetails" class="pokemon-details invisible"></section>

        <section id="errorMessage" class="error-message invisible"></section>
    </div>

    <script>
        const state = {
            lastQuery: '1',
            cached: {},
        };

        const el = {
            searchInput: document.getElementById('searchInput'),
            searchButton: document.getElementById('searchButton'),
            loadRandom: document.getElementById('loadRandom'),
            loadBatch: document.getElementById('loadBatch'),
            loading: document.getElementById('loading'),
            pokedexGrid: document.getElementById('pokedexGrid'),
            pokemonDetails: document.getElementById('pokemonDetails'),
            errorMessage: document.getElementById('errorMessage'),
        };

        function setVisible(element, show) {
            element.classList.toggle('invisible', !show);
        }

        function setError(message) {
            el.errorMessage.textContent = message;
            setVisible(el.errorMessage, !!message);
        }

        function setLoading(isLoading) {
            setVisible(el.loading, isLoading);
        }

        function renderPokemonCard(pokemon) {
            const card = document.createElement('article');
            card.className = 'pokemon-card';
            card.innerHTML = `
                <img src="${pokemon.sprites.front_default || ''}" alt="${pokemon.name} sprite" />
                <h3>#${pokemon.id} ${pokemon.name.toUpperCase()}</h3>
                <div class="types">${pokemon.types.map(t => `<span class="type type-${t.type.name}">${t.type.name}</span>`).join(' ')}</div>
            `;
            card.addEventListener('click', () => showDetails(pokemon));
            return card;
        }

        function showDetails(pokemon = null) {
            if (!pokemon) {
                el.pokemonDetails.innerHTML = '';
                setVisible(el.pokemonDetails, false);
                return;
            }

            const types = pokemon.types.map(t => t.type.name).join(', ');
            const stats = pokemon.stats.map(s => `<li>${s.stat.name.toUpperCase()}: ${s.base_stat}</li>`).join('');
            el.pokemonDetails.innerHTML = `
                <div class="details-card">
                    <h2>#${pokemon.id} ${pokemon.name.toUpperCase()}</h2>
                    <img src="${pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default || ''}" alt="${pokemon.name} art" />
                    <p>Type: ${types}</p>
                    <p>Height: ${pokemon.height / 10}m • Weight: ${pokemon.weight / 10}kg</p>
                    <ul>${stats}</ul>
                </div>
            `;
            setVisible(el.pokemonDetails, true);
        }

        async function fetchPokemon(query) {
            const key = String(query).toLowerCase();
            if (state.cached[key]) return state.cached[key];
            setLoading(true); setError('');
            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${key}`);
                if (!response.ok) throw new Error('Pokemon not found');
                const data = await response.json();
                state.cached[key] = data;
                return data;
            } finally {
                setLoading(false);
            }
        }

        async function addPokemon(query) {
            try {
                const pokemon = await fetchPokemon(query);
                state.lastQuery = pokemon.name;
                el.pokedexGrid.appendChild(renderPokemonCard(pokemon));
                showDetails(pokemon);
                setError('');
            } catch (err) {
                setError(err.message || 'Failed to fetch Pokemon');
            }
        }

        async function searchHandler() {
            const value = el.searchInput.value.trim();
            if (!value) return setError('Type a name or id first.');
            el.pokedexGrid.innerHTML = '';
            await addPokemon(value);
        }

        function randomInt(max) {
            return Math.floor(Math.random() * max) + 1;
        }

        el.searchButton.addEventListener('click', searchHandler);
        el.searchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') searchHandler();
        });
        el.loadRandom.addEventListener('click', async () => {
            el.pokedexGrid.innerHTML = '';
            await addPokemon(randomInt(1010));
        });

        async function fetchPokemonList(limit = 20, offset = 0) {
            setLoading(true);
            setError('');
            try {
                const listResponse = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${limit}&offset=${offset}`);
                if (!listResponse.ok) throw new Error('Could not load Pokédex list');
                const list = await listResponse.json();
                const entries = await Promise.all(list.results.map(e => fetchPokemon(e.name)));
                return entries;
            } finally {
                setLoading(false);
            }
        }

        async function loadDefaultPokedex() {
            el.pokedexGrid.innerHTML = '';
            try {
                const entries = await fetchPokemonList(20, 0);
                entries.forEach(pokemon => el.pokedexGrid.appendChild(renderPokemonCard(pokemon)));
                if (entries.length) showDetails(entries[0]);
                setError('');
            } catch (err) {
                setError(err.message || 'Unable to load pokedex');
            }
        }

        el.searchButton.addEventListener('click', searchHandler);
        el.searchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') searchHandler();
        });
        el.loadRandom.addEventListener('click', async () => {
            el.pokedexGrid.innerHTML = '';
            await addPokemon(randomInt(1010));
        });
        el.loadBatch.addEventListener('click', loadDefaultPokedex);

        window.addEventListener('DOMContentLoaded', () => {
            loadDefaultPokedex();
        });
    </script>
</body>
</html>
